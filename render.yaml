services:
  - type: web
    name: oliveboard-mock-test-app
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OLIVEBOARD_ADMIN_TOKEN
        generateValue: true
